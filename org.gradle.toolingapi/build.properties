# This bundle wraps the Gradle Tooling API jar and is assembled by
# eclipsebuild.jar.ExistingJarBundlePlugin, not by PDE. The file exists so that PDE does not
# report the project as misconfigured. Keep the jar name in sync with toolingApiVersion in
# gradle.properties, the same way Bundle-ClassPath and .classpath are.
bin.includes = META-INF/,\
               org.gradle.toolingapi_8.9.0.jar,\
               about.html
